<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Stáj Tiffany</title>
<meta name="theme-color" content="#FFF7EE">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Stáj">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="app">
  <header class="topbar">
    <button class="avatar-btn" id="btnProfile" aria-label="Profil">
      <span id="miniHorse" class="mini-horse"></span>
    </button>
    <div class="topbar-mid">
      <div class="level-row">
        <span id="levelName" class="level-name">Hříbátko</span>
        <span id="levelNum" class="level-num">1</span>
      </div>
      <div class="xpbar"><i id="xpFill"></i></div>
    </div>
    <div class="stats">
      <div class="stat" id="statCoins"><span class="hs"></span><b>0</b></div>
      <div class="stat" id="statStreak"><span class="stat-ico">🔥</span><b>0</b></div>
    </div>
  </header>

  <main id="screen"></main>

  <nav class="tabbar" id="tabbar">
    <button data-tab="dnes" class="on"><span>📋</span>Dnes</button>
    <button data-tab="tyden"><span>🗓️</span>Týden</button>
    <button data-tab="staj"><span>🐴</span>Stáj</button>
    <button data-tab="ukoly"><span>✏️</span>Úkoly</button>
  </nav>
</div>

<div id="sheet" class="sheet" hidden>
  <div class="sheet-bg" data-close></div>
  <div class="sheet-card">
    <div class="sheet-head"><h2 id="sheetTitle"></h2><button class="x" data-close aria-label="Zavřít">✕</button></div>
    <div id="sheetBody" class="sheet-body"></div>
  </div>
</div>

<div id="toast" class="toast" hidden></div>
<canvas id="confetti"></canvas>

<script src="horse.js"></script>
<script src="app.js"></script>
</body>
</html>
