<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Polárka</title>
<meta name="theme-color" content="#0E1230">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Polárka">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css?v=10">
</head>
<body>

<div id="app">
  <header class="topbar">
    <div class="brand">Polárka</div>
    <div class="tally" id="tally"></div>
  </header>

  <main id="screen"></main>

  <nav class="tabbar" id="tabbar">
    <button data-tab="obloha" class="on"><span>✨</span>Obloha</button>
    <button data-tab="prehled"><span>📊</span>Přehled</button>
    <button data-tab="ukoly"><span>✏️</span>Úkoly</button>
  </nav>
</div>

<div id="sheet" class="sheet" hidden>
  <div class="sheet-bg" data-close></div>
  <div class="sheet-card">
    <div class="sheet-head"><h2 id="sheetTitle"></h2><button class="x" data-close aria-label="Zavřít">✕</button></div>
    <div id="sheetBody" class="sheet-body"></div>
  </div>
</div>

<div id="toast" class="toast" hidden></div>

<script src="sky.js?v=10"></script>
<script src="app.js?v=10"></script>
</body>
</html>
